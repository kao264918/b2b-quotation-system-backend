name: Prod Smoke Gate

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Smoke environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
  push:
    branches: [main, develop]
    paths:
      - 'b2b-quotation-system/**'
      - 'b2b-quotation-system-backend/**'
      - '.github/workflows/prod-smoke-gate.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'b2b-quotation-system/**'
      - 'b2b-quotation-system-backend/**'
      - '.github/workflows/prod-smoke-gate.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: b2b-quotation-system-backend
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, proxy]
    env:
      TARGET_ENV: ${{ github.event.inputs.env || 'prod' }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate smoke credentials
        run: |
          if [ -z "${SMOKE_EMAIL}" ] || [ -z "${SMOKE_PASSWORD}" ]; then
            echo "SMOKE_EMAIL / SMOKE_PASSWORD secrets are required."
            exit 1
          fi

      - name: Run smoke test (${{ matrix.mode }})
        run: |
          python scripts/smoke_test.py \
            --env "${TARGET_ENV}" \
            --mode "${{ matrix.mode }}" \
            --email "${SMOKE_EMAIL}" \
            --password "${SMOKE_PASSWORD}" \
            --json
